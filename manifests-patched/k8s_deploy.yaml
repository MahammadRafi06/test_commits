apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: dynamo-disagg
  namespace: production
spec:
  replicas: 3
  services:
    Frontend:
      componentType: frontend
      envFromSecret: hf-token-secret
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.9.0
          imagePullPolicy: IfNotPresent
      replicas: 1
    VllmDecodeWorker:
      componentType: worker
      envFromSecret: hf-token-secret
      extraPodSpec:
        mainContainer:
          args:
          - --model
          - Qwen/Qwen3-32B-FP8
          - --tensor-parallel-size
          - '8'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --kv-cache-dtype
          - fp8
          - --max-num-seqs
          - '512'
          - --max-num-batched-tokens
          - '512'
          - --is-decode-worker
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          command:
          - python3
          - -m
          - dynamo.vllm
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.9.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/examples/backends/vllm
      replicas: 3
      resources:
        limits:
          gpu: '8'
      subComponentType: decode
    VllmPrefillWorker:
      componentType: worker
      envFromSecret: hf-token-secret
      extraPodSpec:
        mainContainer:
          args:
          - --model
          - Qwen/Qwen3-32B-FP8
          - --tensor-parallel-size
          - '1'
          - --pipeline-parallel-size
          - '1'
          - --data-parallel-size
          - '1'
          - --kv-cache-dtype
          - fp8
          - --max-num-seqs
          - '1'
          - --max-num-batched-tokens
          - '5500'
          - --is-prefill-worker
          - --kv-transfer-config
          - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          command:
          - python3
          - -m
          - dynamo.vllm
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.9.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/examples/backends/vllm
      replicas: 8
      resources:
        limits:
          gpu: '1'
      subComponentType: prefill
