apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: {{mocker-agg}}
spec:
  services:
    Frontend:
      # componentType: frontend
      replicas: {{1}}
      extraPodSpec:
        mainContainer:
          image: {{nvcr.io/nvidia/ai-dynamo/dynamo-planner:my-tag}}
    decode:
      envFromSecret: hf-token-secret
      # componentType: worker
      # subComponentType: decode
      replicas: {{1}}
      resources:
        limits:
          gpu: {{"1"}}
        requests:
          custom:
            # Increase this value for larger models
            ephemeral-storage: {{"2Gi"}}
      gpuMemoryService:
        enabled: true
      extraPodSpec:
        mainContainer:
          image: {{nvcr.io/nvidia/ai-dynamo/dynamo-planner:my-tag}}
          workingDir: /workspace
          # command:
          # - python3
          # - -m
          # - dynamo.mocker
          # args:
          #   - --model-path
          #   - nvidia/Llama-3.1-8B-Instruct-FP8
          #   - --model-name
          #   - nvidia/Llama-3.1-8B-Instruct-FP8
          #   - --speedup-ratio
          #   - "1.0"
          #   - --planner-profile-data
          #   - /workspace/components/src/dynamo/planner/tests/data/profiling_results/H200_TP1P_TP1D