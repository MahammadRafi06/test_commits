agg_kvbm:
      # examples__backends__vllm__deploy__agg_kvbm
    decode:
      - --enforce-eager
      - --kv-transfer-config
      - '{"kv_connector":"DynamoConnector","kv_connector_module_path":"kvbm.vllm_integration.connector","kv_role":"kv_both"}'
agg_kv_aprox:
    # examples__backends__vllm__deploy__agg_router_kv_approx
    frontend:
      - --router-mode
      - kv
      - --no-kv-events
    decode:
      - --kv-events-config
      - '{"enable_kv_cache_events": false}
agg_kv_router:
    deocde: 
      - --kv-events-config
      - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
diagg:
  VllmPrefillWorker:
      - --kv-transfer-config
      - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
disagg_kvbm:
  VllmDecodeWorker:
      - --kv-transfer-config
      - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
      - --max-model-len
      - "32000"
      - --enforce-eager
  VllmPrefillWorker:
      - --max-model-len
      - "32000"
      - --enforce-eager
      - --kv-transfer-config
      - '{"kv_connector":"PdConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"DynamoConnector","kv_connector_module_path":"kvbm.vllm_integration.connector","kv_role":"kv_both"},{"kv_connector":"NixlConnector","kv_role":"kv_both"}]},"kv_connector_module_path":"kvbm.vllm_integration.connector"}'
disagg_router: 
  VllmPrefillWorker:
      - --kv-transfer-config
      - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
      - --kv-events-config

disagg_multinode:
  decode:
      - --is-decode-worker
      - --kv-transfer-config
      - '{"kv_connector": "NixlConnector", "kv_role": "kv_both", "engine_id":
        "vllm-disagg-decode-engine-0abc123"}'
  prefill:
      - --kv-transfer-config
      - '{"kv_connector": "NixlConnector", "kv_role": "kv_both", "engine_id":
        "vllm-disagg-prefill-engine-0abc123"}'

aws_disagg:
  VllmDecodeWorker:
    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config": {"backends": ["LIBFABRIC"]}}'
  VllmPrefillWorker:
    --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_connector_extra_config": {"backends": ["LIBFABRIC"]}}' 

deepseek:
  args:
                  --model "${MODEL_PATH}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --trust-remote-code \
                --kv-cache-dtype fp8 \
                --block-size 256 \
                --tensor-parallel-size 8 \
                --enable-expert-parallel \
                --tokenizer-mode deepseek_v4 \
                --dyn-reasoning-parser deepseek_v4 \
                --dyn-tool-call-parser deepseek_v4 \
                --attention-config '{"use_fp4_indexer_cache":true}' \
                --compilation-config '{"mode":0,"cudagraph_mode":"FULL_DECODE_ONLY"}' \
                --max-num-seqs 256